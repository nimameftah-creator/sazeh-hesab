<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>آفلاین — دفتر ساختمان</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #080e1a;
        background-image:
          radial-gradient(900px 420px at 85% 0%, rgba(16,185,129,.14), transparent 60%),
          radial-gradient(700px 420px at 5% 100%, rgba(56,189,248,.12), transparent 55%);
        font-family: "Segoe UI", Tahoma, sans-serif;
        color: #e2e8f0;
        padding: 24px;
        text-align: center;
      }
      .box {
        max-width: 480px;
        border: 1px solid #243044;
        border-radius: 20px;
        padding: 40px 30px;
        background: linear-gradient(160deg, rgba(28,38,55,.92), rgba(17,26,43,.92));
        box-shadow: 0 24px 70px -20px rgba(0,0,0,.75);
      }
      .emoji { font-size: 54px; margin-bottom: 14px; }
      h1 { font-size: 20px; margin: 0 0 12px; }
      p { font-size: 13px; line-height: 2; color: #94a3b8; margin: 0 0 22px; }
      button {
        font-family: inherit; font-size: 13px;
        padding: 11px 28px; border: 0; border-radius: 12px;
        color: #fff; background: linear-gradient(to left, #10b981, #0d9488);
        cursor: pointer; box-shadow: 0 12px 26px -12px rgba(16,185,129,.65);
      }
      button:active { transform: scale(.98); }
      .hint { font-size: 11px; color: #64748b; margin-top: 16px; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="emoji">📡</div>
      <h1>اتصال اینترنت برقرار نیست</h1>
      <p>
        داده‌های دفتر ساختمان روی سرور ذخیره می‌شوند.
        <br />
        برای دیدن اطلاعات، به اینترنت نیاز دارید.
      </p>
      <button onclick="history.back()">تلاش دوباره</button>
      <p class="hint">اگر در ساختمان هستید و اینترنت ضعیف است، کمی صبر کنید و دوباره تلاش کنید.</p>
    </div>
  </body>
</html>
