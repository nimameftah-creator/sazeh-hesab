<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>آفلاین — دفتر ساختمان</title>
    <meta name="theme-color" content="#080e1a" />
    <link rel="icon" href="/favicon-48.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Regular.woff2"
    />
    <style>
      @font-face {
        font-family: Vazirmatn;
        src: url("https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Regular.woff2")
          format("woff2");
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #080e1a;
        background-image:
          radial-gradient(900px 400px at 85% 0%, rgba(16, 185, 129, 0.13), transparent 60%),
          radial-gradient(700px 400px at 5% 100%, rgba(56, 189, 248, 0.11), transparent 55%);
        font-family: Vazirmatn, Tahoma, sans-serif;
        color: #e2e8f0;
        padding: 24px;
        text-align: center;
      }
      .box {
        max-width: 460px;
        border: 1px solid #243044;
        border-radius: 20px;
        padding: 36px 28px;
        background: linear-gradient(160deg, rgba(28, 38, 55, 0.9), rgba(17, 26, 43, 0.9));
        box-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.7);
      }
      .emoji {
        font-size: 52px;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 19px;
        margin: 0 0 10px;
      }
      p {
        font-size: 13px;
        line-height: 1.9;
        color: #94a3b8;
        margin: 0 0 20px;
      }
      button {
        font-family: inherit;
        font-size: 13px;
        padding: 10px 26px;
        border: 0;
        border-radius: 12px;
        color: #fff;
        background: linear-gradient(to left, #10b981, #0d9488);
        cursor: pointer;
        box-shadow: 0 10px 24px -10px rgba(16, 185, 129, 0.6);
      }
      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="emoji">📡</div>
      <h1>اتصال اینترنت نیست</h1>
      <p>
        برای دیدن اطلاعات به‌روز، به اینترنت نیاز دارید.
        <br />
        اگر در ساختمان هستید و اینترنت ضعیف است، کمی صبر کنید و دوباره تلاش کنید.
      </p>
      <button onclick="location.reload()">تلاش دوباره</button>
    </div>
  </body>
</html>
